<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Local Budget</title>
    <meta name="description" content="An iOS-friendly web/PWA spend tracker designed to keep your daily spending on track, calculate allowances, and safeguard your savings goals." />
    <meta property="og:title" content="Local Budget" />
    <meta property="og:description" content="An iOS-friendly web/PWA spend tracker designed to keep your daily spending on track, calculate allowances, and safeguard your savings goals." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LocalBudget" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved !== 'dark' && saved !== 'light') {
            var prefs = localStorage.getItem('local_budget_preferences');
            if (prefs) {
              var parsed = JSON.parse(prefs);
              if (parsed && (parsed.theme === 'dark' || parsed.theme === 'light')) {
                saved = parsed.theme;
              }
            }
          }
          var isDark = saved === 'dark';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var metaTheme = document.querySelectorAll('meta[name="theme-color"]');
          metaTheme.forEach(function (m) {
            m.setAttribute('content', isDark ? '#020617' : '#FFFFFF');
          });
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
